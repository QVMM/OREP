port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  port_range_start: 50100
  port_range_end: 50200
  use_external_ip: true
  # If your cloud host uses NAT and LiveKit cannot discover the public IP,
  # uncomment the next line before rendering and set PUBLIC_IP in .env.production.
  # node_ip: ${PUBLIC_IP}

keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}

redis:
  address: redis:6379
  password: ${REDIS_PASSWORD}

logging:
  level: info
