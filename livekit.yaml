# LiveKit 本地开发配置
port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  # 本地开发默认使用 127.0.0.1。局域网调试可临时改为本机局域网 IP；
  # 生产环境请使用 deploy/livekit.prod.yaml 生成 livekit.rendered.yaml。
  node_ip: 127.0.0.1
  tcp_port: 7881
  port_range_start: 50100
  port_range_end: 50200
  use_external_ip: false

keys:
  devkey-orep-local: OREP_DEV_ONLY_LIVEKIT_SECRET_32_CHARS

redis:
  address: 127.0.0.1:6379

logging:
  level: info
