<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">小竞吉祥物三方向概念稿 v1</title>
  <desc id="desc">竞赛大脑 Web Rive 吉祥物三种克制矢量造型方向。</desc>
  <defs>
    <style>
      .bg { fill: #f6f2ec; }
      .panel { fill: #fffaf4; stroke: rgba(18,20,26,.12); stroke-width: 1.5; }
      .ink { fill: #12141a; }
      .ink-stroke { stroke: #12141a; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .muted-stroke { stroke: rgba(18,20,26,.16); stroke-width: 3; stroke-linecap: round; fill: none; }
      .orange { fill: #e84a1c; }
      .orange-deep { fill: #c43a12; }
      .cream { fill: #f6f2ec; }
      .white { fill: #fff; }
      .soft { fill: #fde8de; }
      .green { fill: #0f9f6e; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #12141a; font-size: 22px; font-weight: 700; }
      .note { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; font-size: 15px; font-weight: 500; }
      .micro { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="620"/>
  <text x="56" y="62" class="label">小竞 · Rive 吉祥物造型方向 v1</text>
  <text x="56" y="92" class="note">目标：克制、冷静教练感；像“状态灯的拟人版”，不抢本场得分主视觉。</text>

  <g transform="translate(56 126)">
    <rect class="panel" width="332" height="420" rx="18"/>
    <text x="28" y="46" class="label">A · 大脑引擎鹅卵石</text>
    <text x="28" y="74" class="note">识别强，品牌感足；表情空间中等</text>
    <g transform="translate(56 106)">
      <ellipse cx="111" cy="238" rx="72" ry="13" fill="rgba(18,20,26,.08)"/>
      <path class="orange" d="M52 92c0-38 31-67 70-67h37c39 0 70 29 70 67v59c0 47-38 86-86 86h-5c-48 0-86-39-86-86z"/>
      <path class="orange-deep" d="M86 30c9-14 25-22 44-22h20c20 0 36 8 44 22-15-6-33-8-54-8s-39 2-54 8z" opacity=".85"/>
      <path class="cream" d="M75 98c0-28 23-51 51-51h29c28 0 51 23 51 51v48c0 37-30 67-67 67s-64-30-64-67z"/>
      <path class="muted-stroke" d="M112 62c-10 11-13 24-9 39M141 52c-8 17-7 33 3 48M171 65c10 14 11 28 4 43"/>
      <g transform="translate(96 122)">
        <ellipse class="white" cx="23" cy="20" rx="18" ry="15"/>
        <ellipse class="white" cx="66" cy="20" rx="18" ry="15"/>
        <circle class="ink" cx="28" cy="21" r="7"/>
        <circle class="ink" cx="71" cy="21" r="7"/>
      </g>
      <path class="ink-stroke" d="M124 169c9 5 22 5 31 0" opacity=".55"/>
      <rect class="ink" x="94" y="224" width="92" height="18" rx="9"/>
      <circle class="green" cx="193" cy="78" r="8"/>
    </g>
    <text x="28" y="374" class="micro">Rive 分层：外壳 / 脸 / 眼白 / 瞳孔 / 脑纹 / 底座</text>
  </g>

  <g transform="translate(434 126)">
    <rect class="panel" width="332" height="420" rx="18"/>
    <text x="28" y="46" class="label">B · 状态胶囊教练</text>
    <text x="28" y="74" class="note">最克制，最像产品 UI；推荐方向</text>
    <g transform="translate(56 106)">
      <ellipse cx="111" cy="238" rx="60" ry="12" fill="rgba(18,20,26,.08)"/>
      <rect class="orange" x="49" y="38" width="122" height="188" rx="61"/>
      <rect class="cream" x="62" y="52" width="96" height="158" rx="48"/>
      <rect class="ink" x="76" y="102" width="68" height="42" rx="21"/>
      <circle class="white" cx="97" cy="123" r="8"/>
      <circle class="white" cx="124" cy="123" r="8"/>
      <circle class="ink" cx="100" cy="124" r="4"/>
      <circle class="ink" cx="127" cy="124" r="4"/>
      <rect class="orange-deep" x="151" y="82" width="25" height="58" rx="12"/>
      <circle class="green" cx="163" cy="99" r="5"/>
      <path class="ink-stroke" d="M88 161c13 6 32 6 45 0" opacity=".48"/>
      <path class="muted-stroke" d="M58 133c-16 3-24 12-27 28M162 133c16 3 24 12 27 28"/>
      <rect class="ink" x="82" y="221" width="58" height="16" rx="8"/>
      <path class="soft" d="M64 57c18-18 61-21 88 5-21-8-60-9-88-5z"/>
    </g>
    <text x="28" y="374" class="micro">Rive 分层：胶囊体 / 眼罩 / 瞳孔 / 指示灯 / 手势 / 底座</text>
  </g>

  <g transform="translate(812 126)">
    <rect class="panel" width="332" height="420" rx="18"/>
    <text x="28" y="46" class="label">C · 分数信号助手</text>
    <text x="28" y="74" class="note">与评分总结关联强；造型略更有角色感</text>
    <g transform="translate(56 106)">
      <ellipse cx="111" cy="238" rx="68" ry="13" fill="rgba(18,20,26,.08)"/>
      <path class="orange" d="M69 66c0-22 18-40 40-40h4c22 0 40 18 40 40v13l32 23c13 9 13 28 0 37l-32 23v10c0 28-23 51-51 51s-51-23-51-51V66z"/>
      <path class="cream" d="M79 71c0-17 14-31 31-31h3c17 0 31 14 31 31v95c0 23-18 41-41 41s-42-18-42-41V92c0-12 8-21 18-21z"/>
      <path class="soft" d="M144 88l30 22c6 5 6 14 0 19l-30 22z"/>
      <circle class="orange-deep" cx="158" cy="117" r="10"/>
      <g transform="translate(79 104)">
        <ellipse class="white" cx="24" cy="21" rx="17" ry="14"/>
        <ellipse class="white" cx="63" cy="21" rx="17" ry="14"/>
        <circle class="ink" cx="28" cy="22" r="6"/>
        <circle class="ink" cx="67" cy="22" r="6"/>
      </g>
      <path class="ink-stroke" d="M98 158c9 4 22 4 31 0" opacity=".48"/>
      <path class="muted-stroke" d="M83 73h39M83 86h29"/>
      <path class="ink-stroke" d="M62 174l-19 17M158 174l18 17" opacity=".42"/>
      <rect class="ink" x="79" y="221" width="66" height="16" rx="8"/>
    </g>
    <text x="28" y="374" class="micro">Rive 分层：主体 / 侧信号 / 眼白 / 瞳孔 / 手势 / 底座</text>
  </g>

  <g transform="translate(56 574)">
    <circle class="orange" cx="8" cy="-5" r="5"/>
    <text x="22" y="0" class="note">建议推进：B 为主造型，吸收 A 的“大脑引擎”顶纹作为弱特征；C 的信号点可作为 nudge/celebrate 状态变化。</text>
  </g>
</svg>
