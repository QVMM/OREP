      if(!ready.length){toast(incomplete.length?`有 ${incomplete.length} 个草稿尚未填写完整，暂不能发布`:"当前周期没有可批量发布的草稿");return}
      ready.forEach(value=>{uiState.dayPlanStates[value]="published";publishDaySnapshot(value)});render();toast(`已发布 ${ready.length} 个完整计划${incomplete.length?`，另有 ${incomplete.length} 个草稿待完善`:""}`);return
    }
    if(action==="save-next"){
      if(uiState.dayPlanStates[dayNumber]!=="published")uiState.dayPlanStates[dayNumber]="draft";
      const order=[...Array.from({length:currentCampDuration()-dayNumber},(_,i)=>dayNumber+i+1),...Array.from({length:dayNumber-1},(_,i)=>i+1)],next=order.find(value=>!uiState.dayPlanStates[value]||uiState.dayPlanStates[value]==="unplanned"||uiState.dayPlanStates[value]==="withdrawn");
      if(next){uiState.campDay=next;uiState.activeSubmissionIndex=0;uiState.formatSearch="";render();toast(`第 ${dayNumber} 天已保存，已切换到第 ${next} 天`)}else{render();toast(`第 ${dayNumber} 天已保存，当前周期已全部规划`)}return
    }
    if(action==="withdraw")uiState.dayPlanStates[dayNumber]="withdrawn";
    render();toast(`第 ${dayNumber} 天计划已撤回`);return
  }
  const rv=e.target.closest("[data-recording-view]");if(rv){uiState.recordingView=rv.dataset.recordingView;render();return}
  const report=e.target.closest("[data-report-view]");if(report){uiState.reportView=report.dataset.reportView;render();return}
  const dashboardPeriod=e.target.closest("[data-dashboard-period]");if(dashboardPeriod){uiState.dashboardPeriod=dashboardPeriod.dataset.dashboardPeriod;render();return}
  const action=e.target.closest("[data-action]");if(action){
    const a=action.dataset.action;
    if(a==="toggle-roadshow"){uiState.roadshowEmpty=!uiState.roadshowEmpty;render();return}
    if(a==="publish-next"){uiState.queueIndex=(uiState.queueIndex+1)%queueItems.length;toast("已发布，已切换到下一项");render();return}
    if(a==="analytics-drill"){toast(`已下钻：${action.dataset.name} · 4 条评分证据`);return}
    if(a==="remind-one"){toast(`已向 ${action.dataset.name} 发送提醒`);return}
    if(a==="seek"){toast(`回放已定位到 ${action.dataset.time}`);return}
    if(a==="preview-day"){openStudentDayPreview();return}
    const messages={refresh:"数据已刷新",restore:"已恢复 AI 原版",skip:"已暂不处理",save:"草稿已保存",withdraw:"当天任务已撤回","publish-plan":"训练计划已发布到学生端","add-deliverable":"已增加一个交付项",remind:"已向 6 名未交学生发送提醒","remind-unsubmitted":"已向当前训练日的未提交学生发送提醒","enter-room":"正在进入路演会议室","publish-report":"评分报告已确认并发布","publish-todo":"待办已发布到学生端","save-todo":"老师版本已保存",notifications:"暂无新的待处理消息","account-settings":"已打开账号设置示意","logout":"已进入退出登录确认流程"};
    toast(messages[a]||"操作已记录到交互原型");return
  }
  if(e.target.closest(".topbar-popover"))return;
  closeTopbarMenus();
});

});
